<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Code Launcher</title>
    <link rel="stylesheet" href="vendor/xterm.css">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body>
    <!-- Title Bar -->
    <div class="title-bar">
        <h1>⚡ Claude Code Launcher</h1>
    </div>

    <!-- Main Layout -->
    <div class="main-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">Grupos</div>
            <div class="sidebar-groups" id="sidebar-groups"></div>
            <div class="sidebar-footer">
                <div class="add-group-btn" id="add-group-btn">
                    <span>＋</span>
                    <span>Adicionar grupo</span>
                </div>
            </div>
        </div>

        <!-- Terminal Area -->
        <div class="terminal-area">
            <!-- Tab Bar -->
            <div class="tab-bar" id="tab-bar"></div>

            <!-- Split: terminal pane (top) + composer pane (bottom) -->
            <div class="split-area" id="split-area">
                <!-- Terminal Container -->
                <div class="terminal-pane" id="terminal-pane">
                    <div class="terminal-container" id="terminal-container">
                        <!-- Welcome Screen -->
                        <div class="welcome" id="welcome">
                            <div class="welcome-icon">⚡</div>
                            <div class="welcome-text">Clique <b>+</b> em um grupo para abrir um terminal</div>
                            <div class="welcome-hint">Cada terminal roda no diretório do projeto (tipo configurado na sidebar)</div>
                        </div>
                    </div>
                </div>

                <!-- Drag handle -->
                <div class="pane-splitter" id="pane-splitter" title="Arraste para redimensionar"></div>

                <!-- Composer pane: format-aware message input -->
                <div class="composer-pane" id="composer-pane">
                    <div class="composer-header">
                        <span class="composer-target" id="composer-target">Sem terminal ativo</span>
                        <span class="composer-hint">
                            <kbd>Enter</kbd> enviar &nbsp;·&nbsp;
                            <kbd>Shift</kbd>+<kbd>Enter</kbd> nova linha &nbsp;·&nbsp;
                            <kbd>↑</kbd>/<kbd>↓</kbd> histórico
                        </span>
                    </div>
                    <textarea
                        id="composer-textarea"
                        class="composer-textarea"
                        placeholder="Escreva sua mensagem... (Enter envia, Shift+Enter quebra linha)"
                        spellcheck="false"
                        rows="3"></textarea>
                    <div class="composer-footer">
                        <span class="composer-status" id="composer-status"></span>
                        <button class="composer-send-btn" id="composer-send-btn" title="Enviar (Enter)">Enviar ↵</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="vendor/xterm.min.js"></script>
    <script src="vendor/xterm-addon-fit.min.js"></script>
    <script src="vendor/xterm-addon-web-links.min.js"></script>
    <script src="js/terminal.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/tabs.js"></script>
    <script src="js/composer.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
